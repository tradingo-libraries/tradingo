[project]
name = "tradingo"
dynamic = ["version"]
authors = [
  { name="Rory McStay", email="rory@rorymcstay.com" },
]
requires-python = ">= 3.11"
description = "Instrument price store"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
  "numpy>=2.3.2",
  "numba>=0.65",
  # pandas 2.3.3 is the only 2.x with cp314 wheels; pandas 3.x has none yet, so
  # cap <3 (a pandas-3 migration is a separate, later effort).
  "pandas>=2.3.3,<3",
  "pandera",
  "arcticdb>=6.8.0",
  "PyYAML",
  "yfinance",
  "lxml>=6.0.3",
  "pandas_market_calendars",
  "trading_ig>=0.0.24",
  "riskfolio-lib>=7.3.0",
  "tenacity",
  "lightgbm>=4.6.0",
  "pycountry",
  "ipython>=9.1.0",
  "tabula>=1.0.5",
  "tabula-py>=2.10.0",
  "dukascopy-python",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-benchmark",
  "black",
  "isort",
  "ruff>=0.11.5",
  "mypy>=1.15.0",
  "debugpy>=1.8.13",
  "pre-commit>=3.6.0",
  "pandas-stubs>=2.3.3.260113",
  "pytest-cov>=7.0.0",
  "types-requests>=2.32.4.20260107",
  "httpx>=0.28.1",
  "types-croniter>=6.0.0.20250809",
  "fakeredis>=2.35.1",
  "pytest-xdist[psutil]>=3.8.0",
  "opentelemetry-sdk>=1.27",
]
research = [
  "dtale",
  "jupyter",
]
serve = [
  "croniter>=6.0.0",
  "fastapi",
]
worker = [
  "celery>=5.0",
  "redis>=4.0",
]
ib = [
  "ib_async>=2.1.0",
]
databento = [
  "databento",
]


[tool.uv]
# Several transitive deps gained cp314 wheels only in recent releases; older
# versions that still satisfy our (loose) pins have no cp314 wheel and fail to
# build from source. Steer these transitive deps up on 3.14 only — this
# constrains existing transitive deps, not new runtime deps.
#   scs       : cp314 wheels from 3.2.8 (riskfolio-lib allows 3.2.7.post2)
#   scipy     : cp314 wheels from 1.16.2
constraint-dependencies = [
  "scs>=3.2.8; python_version >= '3.14'",
  "scipy>=1.16.2; python_version >= '3.14'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tradingo.templates" = ["*.yaml"]

[build-system]
requires = [
  "cython>=3.1.3",
  "numpy",
  "setuptools>=64",
  "setuptools_scm>=8",
]

[tool.black]
line-length = 88
target-version = ['py311']

[project.entry-points."airflow.plugins"]
tradingo_otel = "tradingo.airflow_plugin:TradingoOtelPlugin"

[project.entry-points.opentelemetry_traces_sampler]
tradingo_task = "tradingo.sampler:task_root_sampler"

[project.scripts]
tradingo-cli = "tradingo.cli:main"
tradingo-engine-ib = "tradingo.engine.ib:main"

[tool.setuptools_scm]

[tool.isort]
profile = "black"

[tool.mypy]
exclude = [
  "build",
]

[[tool.mypy.overrides]]
module = [
  "celery",
  "celery.*",
  "redis",
  "redis.*",
  "pandas.plotting._matplotlib.style",
  "arcticdb",
  "arcticdb.*",
  "arcticdb_ext",
  "arcticdb_ext.*",
  "dateutil",
  "dateutil.*",
  "sklearn.*",
  "yfinance",
  "riskfolio",
  "yaml",
  "setuptools",
  "numba",
  "pandas_market_calendars",
  "trading_ig.*",
  "dukascopy_python",
  "dukascopy_python.*",
  "ib_async",
  "ib_async.*",
  "databento",
  "databento.*",
  "Cython.*",
  "dash",
  "requests.exceptions",
  "uvicorn",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "ib_insync",
  "ib_insync.*",
]
ignore_missing_imports = true
follow_imports = "skip"
strict = true

[tool.coverage.run]
source = ["src/tradingo"]
branch = true
omit = [
  "src/tradingo/templates/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true
